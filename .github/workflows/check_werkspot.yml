name: Check Werkspot Leads

on:
  schedule:
    # Draait elke 15 min binnen 06:00-20:45 UTC. Dit venster dekt de
    # Nederlandse actieve uren in zowel zomer- als wintertijd; de exacte
    # tijden (weekdag 08:00-21:30, weekend 09:00-21:00) worden in de
    # Python-code bepaald met de Europe/Amsterdam tijdzone.
    - cron: '*/15 6-20 * * *'
  workflow_dispatch:           # Handmatig starten (voor testen)

permissions:
  contents: write              # Nodig om opdrachten.json terug te committen

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-werkspot-v1

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browser
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-v2

      - name: Install Playwright Chromium (alleen als niet gecached)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium

      - name: Install Playwright system dependencies
        run: playwright install-deps chromium

      - name: Run Werkspot checker
        env:
          WERKSPOT_EMAIL:    ${{ secrets.WERKSPOT_EMAIL }}
          WERKSPOT_PASSWORD: ${{ secrets.WERKSPOT_PASSWORD }}
          WERKSPOT_COOKIES:  ${{ secrets.WERKSPOT_COOKIES }}
          NTFY_TOPIC:        ${{ secrets.NTFY_TOPIC }}
          GROQ_API_KEY:      ${{ secrets.GROQ_API_KEY }}
        run: python check_werkspot.py

      - name: Upload debug bestanden (altijd)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_number }}
          path: |
            debug_*.png
            debug_*.txt
          retention-days: 3

      - name: Commit bijgewerkte opdrachten.json
        run: |
          git config user.name  "werkspot-bot"
          git config user.email "werkspot-bot@users.noreply.github.com"
          git add opdrachten.json
          git diff --staged --quiet || git commit -m "chore: update opdrachten [skip ci]"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
